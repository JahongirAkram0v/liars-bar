spring.application.name=liars-bar
spring.threads.virtual.enabled=true
# Veb-server yo'q: update'lar long polling orqali olinadi, jarayonni polling oqimi ushlab turadi
spring.main.web-application-type=none
spring.main.keep-alive=true

# Maxfiy qiymatlar .env faylidan yoki muhit o'zgaruvchilaridan olinadi
spring.config.import=optional:file:.env[.properties]

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
telegram.api-url=${TELEGRAM_API_URL:https://api.telegram.org}
telegram.polling-enabled=${TELEGRAM_POLLING_ENABLED:true}
