spring.application.name=liars-bar
server.port=${PORT:8080}

# Maxfiy qiymatlar .env faylidan yoki muhit o'zgaruvchilaridan olinadi
spring.config.import=optional:file:.env[.properties]

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
telegram.webhook-path=${TELEGRAM_WEBHOOK_PATH:/webhook}
telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
telegram.api-url=${TELEGRAM_API_URL:https://api.telegram.org}
telegram.stickers.death=CAACAgIAAxkBAAISJ2k_2HedMrAy56rTSUmmC95548JSAAILhgACTcwAAUpZD2FuI4n8nzYE
telegram.stickers.survive=CAACAgIAAxkBAAISKGk_2I14E9JWUjIAAUKKvNH5LbDIbgAChIoAAkqCAAFKc183VZPcPpA2BA
telegram.stickers.win=CAACAgIAAxkBAAISKWk_2KEROgck7th2Q8BMwrNvhvEMAAIsjgACW7z4Sb-IZaGPsSucNgQ

app.db.path=${DB_PATH:data/liars-bar.db}
spring.sql.init.mode=always

# Xato javoblarida ichki ma'lumot chiqmasin
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.tomcat.max-swallow-size=1MB
server.shutdown=graceful
